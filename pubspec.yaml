name: abhi_suno
description: "Abhi Suno - Open Source Ad-Free Hybrid Music Streaming & In-App Offline Player by Abhishek Pal"
publish_to: 'none'
version: 4.5.1+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.44
  audio_service: ^0.18.17
  path_provider: ^2.1.5
  dio: ^5.7.0
  shared_preferences: ^2.3.5
  http: ^1.3.0
  dart_des: ^1.0.2
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: AmsSudha
      fonts:
        - asset: assets/fonts/AmsSudha.ttf

